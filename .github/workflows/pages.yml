name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备校验环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 校验内容与交互
        run: |
          node tools/check_data.mjs --strict
          node tools/check_render.mjs
          node tools/check_interactions.mjs

      - name: 整理要发布的静态文件
        run: |
          mkdir -p dist
          cp -r index.html assets data .nojekyll dist/

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
