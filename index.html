<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DST Mod 双角色介绍站与资料库">
  <title>我们饥佬是这样的</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;600;900&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/modal.css">
  <link rel="stylesheet" href="assets/css/motion.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到当前栏目内容</a>

  <header class="topbar" id="top">
    <div class="topbar__left">
      <a class="site-mark" href="#intro" aria-label="返回序章顶部">
        <span class="site-mark__line" aria-hidden="true"></span>
        <span class="site-mark__label" aria-hidden="true">序</span>
      </a>
      <button class="nav-toggle icon-button" type="button" data-nav-toggle aria-expanded="false" aria-controls="mobile-nav">
        <span class="sr-only">展开导航</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"></path>
        </svg>
      </button>
    </div>
    <nav class="topbar__nav" aria-label="章节导航">
      <a href="#intro">序</a>
      <a href="#characters">人物</a>
    </nav>
    <div class="topbar__right">
      <button class="icon-button" type="button" data-search-open aria-label="打开全局搜索">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6"></circle>
          <path d="M16 16l4 4"></path>
        </svg>
      </button>
    </div>
    <nav class="mobile-nav" id="mobile-nav" aria-label="移动导航" hidden>
      <a href="#intro">序</a>
      <a href="#characters">人物</a>
    </nav>
  </header>

  <main id="main-content" tabindex="-1">
    <section class="hero" id="intro" data-section="intro">
      <div id="hero-root"></div>
    </section>

    <div id="sections-root"></div>
  </main>

  <footer class="site-footer section--ink">
    <div class="shell" id="footer-root"></div>
  </footer>

  <button class="back-to-top" type="button" data-back-to-top aria-label="回到页面顶部" title="回到顶部" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M6 13l6-6 6 6M12 7v13"></path></svg>
    <span>回到顶部</span>
  </button>

  <aside class="search-panel" data-search-panel hidden>
    <div class="search-panel__mask" data-search-close></div>
    <div class="search-panel__body" role="dialog" aria-modal="true" aria-labelledby="search-title">
      <div class="search-panel__head">
        <h2 id="search-title">全站搜索</h2>
        <button class="icon-button" type="button" data-search-close aria-label="关闭搜索">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>
      <label class="search-field">
        <span class="sr-only">输入关键词</span>
        <input type="search" placeholder="检索角色、物品、机制、建筑、更新" data-global-search-input>
      </label>
      <div class="search-panel__results" id="search-results-root"></div>
    </div>
  </aside>

  <aside class="filter-drawer" data-filter-drawer hidden>
    <div class="filter-drawer__mask" data-filter-drawer-close></div>
    <div class="filter-drawer__body" role="dialog" aria-modal="true" aria-labelledby="filter-drawer-title">
      <div class="filter-drawer__head">
        <h2 id="filter-drawer-title">筛选</h2>
        <button class="icon-button" type="button" data-filter-drawer-close aria-label="关闭筛选">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>
      <div id="filter-drawer-root"></div>
    </div>
  </aside>

  <div class="modal-layer" id="modal-root" hidden></div>
  <aside class="editor-panel" id="editor-panel" hidden></aside>
  <div class="sr-only" aria-live="polite" id="aria-live"></div>

  <script id="tpl-hero" type="x-tmpl-mustache">
    <div class="hero__head reveal in">
      <p class="hero__tag"></p>
      <h1 class="hero__title">{{site_title}}</h1>
      <p class="hero__subtitle">{{subtitle_latin}}</p>
      <p class="hero__meta">{{version}} · {{author}} · <a href="{{workshop_url}}" target="_blank" rel="noreferrer">创意工坊 ↗</a>{{#qq_group_url}} · <a class="hero__join" href="{{qq_group_url}}" target="_blank" rel="noopener noreferrer" aria-label="加入《我们饥佬是这样的》mod交流群">加入交流群 <span aria-hidden="true">↗</span></a>{{/qq_group_url}}</p>
    </div>
    <div class="duo reveal in" id="characters" role="region" aria-label="人物" data-entry-target="hero-duo">
      <article class="duo__char duo__char--left" data-char="{{character_a.id}}" data-entry-target="{{character_a.id}}">
        <div class="duo__name duo__name--left">
          <img src="assets/img/ui/pangtouyu.png" alt="胖头鱼" loading="eager" onerror="window.App.onImageError(this)">
        </div>
        <figure class="duo__portrait">
          <button class="duo__portrait-trigger" type="button" aria-label="查看{{character_a.name}}的专属物品" aria-expanded="false" aria-controls="gear-{{character_a.id}}">
          <img src="{{character_a.portrait}}" alt="{{character_a.name}} 立绘" loading="eager" fetchpriority="high" onerror="window.App.onImageError(this)">
          </button>
        </figure>
        <svg class="duo-gear-lines" aria-hidden="true"></svg>
        <div class="duo-gear" id="gear-{{character_a.id}}" aria-label="{{character_a.name}}的专属物品" aria-hidden="true" inert>
          <p class="duo-gear__heading">角色专属 <span>{{character_a.exclusive_count}} 件 · 点击查看</span></p>
          {{#character_a.featured_items}}
          <button class="duo-gear__item" type="button" data-open-entry="{{id}}" style="--gear-order:{{order}}" aria-label="查看{{name}}详情">
            <span class="duo-gear__image"><img src="{{display_image}}" alt="" loading="eager" onerror="window.App.onImageError(this)">{{#owner_stamp}}<span class="owner-stamp" role="img" aria-label="{{owner_label}}" title="{{owner_label}}">{{owner_stamp}}</span>{{/owner_stamp}}</span><span>{{name}}</span>
          </button>
          {{/character_a.featured_items}}
          {{#character_a.has_shared_crafts}}
          <div class="duo-gear__shared">
            <p>专属制作 <span>其他角色也可使用</span></p>
            <div class="duo-gear__crafts">{{#character_a.shared_crafts}}<button class="duo-gear__craft" type="button" data-open-entry="{{id}}" aria-label="查看{{name}}：胖头鱼制作，可共用"><img src="{{image}}" alt="" loading="eager" onerror="window.App.onImageError(this)"><span>{{name}}</span></button>{{/character_a.shared_crafts}}</div>
          </div>
          {{/character_a.has_shared_crafts}}
        </div>
        <figure class="duo-model" aria-hidden="true">
          <picture>
            <source media="(prefers-reduced-motion: reduce)" srcset="{{character_a.model_poster}}">
            <img src="{{character_a.model_image}}" alt="{{character_a.name}}的游戏人物模型" width="311" height="477" loading="lazy" onerror="window.App.onImageError(this)">
          </picture>
          <figcaption>游戏内形象</figcaption>
        </figure>
        <nav class="duo__fields duo__fields--bottom" aria-label="胖头鱼字段">
          <button class="duo-field" type="button" data-char="{{character_a.id}}" data-panel="setting">
            <img class="duo-field__img" src="assets/img/ui/sheding.png" alt="设定" loading="lazy" onerror="window.App.onImageError(this)">
          </button>
          <button class="duo-field" type="button" data-char="{{character_a.id}}" data-panel="exclusive">
            <img class="duo-field__img" src="assets/img/ui/zhuanshu.png" alt="专属" loading="lazy" onerror="window.App.onImageError(this)">
          </button>
        </nav>
      </article>

      <article class="duo__char duo__char--right" data-char="{{character_b.id}}" data-entry-target="{{character_b.id}}">
        <nav class="duo__fields duo__fields--top" aria-label="高脚鸟字段">
          <button class="duo-field" type="button" data-char="{{character_b.id}}" data-panel="setting">
            <img class="duo-field__img" src="assets/img/ui/sheding.png" alt="设定" loading="lazy" onerror="window.App.onImageError(this)">
          </button>
          <button class="duo-field" type="button" data-char="{{character_b.id}}" data-panel="exclusive">
            <img class="duo-field__img" src="assets/img/ui/zhuanshu.png" alt="专属" loading="lazy" onerror="window.App.onImageError(this)">
          </button>
        </nav>
        <figure class="duo__portrait">
          <button class="duo__portrait-trigger" type="button" aria-label="查看{{character_b.name}}的专属物品" aria-expanded="false" aria-controls="gear-{{character_b.id}}">
          <img src="{{character_b.portrait}}" alt="{{character_b.name}} 立绘" loading="eager" fetchpriority="high" onerror="window.App.onImageError(this)">
          </button>
        </figure>
        <svg class="duo-gear-lines" aria-hidden="true"></svg>
        <div class="duo-gear" id="gear-{{character_b.id}}" aria-label="{{character_b.name}}的专属物品" aria-hidden="true" inert>
          <p class="duo-gear__heading">角色专属 <span>{{character_b.exclusive_count}} 件 · 点击查看</span></p>
          {{#character_b.featured_items}}
          <button class="duo-gear__item" type="button" data-open-entry="{{id}}" style="--gear-order:{{order}}" aria-label="查看{{name}}详情">
            <span class="duo-gear__image"><img src="{{display_image}}" alt="" loading="eager" onerror="window.App.onImageError(this)">{{#owner_stamp}}<span class="owner-stamp" role="img" aria-label="{{owner_label}}" title="{{owner_label}}">{{owner_stamp}}</span>{{/owner_stamp}}</span><span>{{name}}</span>
          </button>
          {{/character_b.featured_items}}
          {{#character_b.has_shared_crafts}}
          <div class="duo-gear__shared">
            <p>专属制作 <span>其他角色也可使用</span></p>
            <div class="duo-gear__crafts">{{#character_b.shared_crafts}}<button class="duo-gear__craft" type="button" data-open-entry="{{id}}" aria-label="查看{{name}}：高脚鸟制作，可共用"><img src="{{image}}" alt="" loading="eager" onerror="window.App.onImageError(this)"><span>{{name}}</span></button>{{/character_b.shared_crafts}}</div>
          </div>
          {{/character_b.has_shared_crafts}}
        </div>
        <figure class="duo-model" aria-hidden="true">
          <picture>
            <source media="(prefers-reduced-motion: reduce)" srcset="{{character_b.model_poster}}">
            <img src="{{character_b.model_image}}" alt="{{character_b.name}}的游戏人物模型" width="426" height="442" loading="lazy" onerror="window.App.onImageError(this)">
          </picture>
          <figcaption>游戏内形象</figcaption>
        </figure>
        <div class="duo__name duo__name--right">
          <img src="assets/img/ui/gaojiaoniao.png" alt="高脚鸟" loading="eager" onerror="window.App.onImageError(this)">
        </div>
      </article>

      <aside class="duo-popup" aria-hidden="true">
        <svg class="duo-popup__line" aria-hidden="true">
          <path class="duo-popup__line-seg" d=""></path>
        </svg>
        <div class="duo-popup__card" role="dialog" aria-modal="false">
          <header class="duo-popup__head">
            <h3 class="duo-popup__title"></h3>
            <button class="duo-popup__close" aria-label="关闭">×</button>
          </header>
          <div class="duo-popup__body"></div>
        </div>
      </aside>
    </div>
  </script>

  <script id="tpl-items" type="x-tmpl-mustache">
    <div class="filters-panel card reveal">
      <div class="filters-panel__block">
        <span class="filters-panel__label">分类</span>
        <div class="chip-row" data-filter-group="category" role="group" aria-label="物品分类（单选）">
          {{#category_options}}
          <button class="chip {{active_class}}" type="button" data-cat="{{value}}" aria-pressed="{{active}}">{{label}}</button>
          {{/category_options}}
        </div>
      </div>
      <label class="search-field search-field--inline">
        <span class="sr-only">筛选物品</span>
        <input type="search" placeholder="检索物品与条目" value="{{query}}" data-item-search-input>
      </label>
      <button class="button item-search-submit" type="button" data-search-submit>搜</button>
      <button class="button button--ghost" type="button" data-clear-filters>清空</button>
      <p class="filters-summary" id="items-summary-root">{{summary}}</p>
    </div>
    <div class="items-grid" id="items-grid-root">
      {{#items}}
      <article class="item-card card" data-entry-target="{{id}}">
        <button class="card-link{{#owner_stamp}} card-link--owned{{/owner_stamp}}" type="button" data-open-entry="{{id}}">
          <span class="item-card__image">
            <img src="{{image}}" alt="{{name}}" loading="lazy" onerror="window.App.onImageError(this)">
            {{#owner_stamp}}<span class="item-card__owner-stamp owner-stamp" role="img" aria-label="{{owner_label}}" title="{{owner_label}}">{{owner_stamp}}</span>{{/owner_stamp}}
          </span>
          <span class="item-card__meta">
            <span class="item-card__topline">{{category_label}}{{#skin_count}} · {{skin_count}} 款外观{{/skin_count}}</span>
            {{#availability}}<span class="availability-badge">{{availability}}</span>{{/availability}}
            <strong class="entry-title">{{#icon}}<img class="entry-icon" src="{{icon}}" alt="" loading="lazy" onerror="window.App.onImageError(this)">{{/icon}}<span>{{{name_html}}}</span></strong>
            <span>{{{summary_html}}}</span>
          </span>
          {{^owner_stamp}}<span class="item-card__owner">{{owner_label}}</span>{{/owner_stamp}}
        </button>
      </article>
      {{/items}}
    </div>
  </script>

  <!-- 通用分区卡片模板，mechanics / 新增分区共用 -->
  <script id="tpl-section-cards" type="x-tmpl-mustache">
    <div class="items-grid">
      {{#entries}}
      <article class="item-card card" data-entry-target="{{id}}">
        <button class="card-link{{^image}} card-link--text{{/image}}{{#owner_stamp}} card-link--owned{{/owner_stamp}}" type="button" data-open-entry="{{id}}">
          {{#image}}
          <span class="item-card__image{{#preview_caption}} item-card__image--scene{{/preview_caption}}">
            <picture class="display-picture">
            {{#display_poster}}<source media="(prefers-reduced-motion: reduce)" srcset="{{display_poster}}">{{/display_poster}}
            <img src="{{image}}" alt="{{name}}" loading="lazy" onerror="window.App.onImageError(this)">
            </picture>
            {{#owner_stamp}}<span class="owner-stamp" role="img" aria-label="{{owner_label}}" title="{{owner_label}}">{{owner_stamp}}</span>{{/owner_stamp}}
          </span>
          {{/image}}
          <span class="item-card__meta">
            <span class="item-card__topline">{{category_label}}{{#preview_caption}} · {{preview_caption}}{{/preview_caption}}</span>
            <strong class="entry-title">{{#icon}}<img class="entry-icon" src="{{icon}}" alt="" loading="lazy" onerror="window.App.onImageError(this)">{{/icon}}<span>{{name}}</span></strong>
            <span>{{summary}}</span>
          </span>
          {{^owner_stamp}}{{#owner_label}}<span class="item-card__owner">{{owner_label}}</span>{{/owner_label}}{{/owner_stamp}}
        </button>
      </article>
      {{/entries}}
    </div>
  </script>

  <script id="tpl-buildings" type="x-tmpl-mustache">
    <div class="building-list" data-building-explorer>
      <div class="building-rooms" role="group" aria-label="青玄阁房间导览">
        {{#entries}}<button type="button" data-building-tab data-building-room="{{id}}" aria-pressed="{{selected}}">{{name}}</button>{{/entries}}
      </div>
      {{#entries}}
      <article class="building-entry{{#has_building_highlights}} building-entry--overview{{/has_building_highlights}}" data-entry-target="{{id}}"{{^selected}} hidden{{/selected}}>
        <div class="building-entry__visual">
          <div class="building-entry__image{{#is_interior}} building-entry__image--interior{{/is_interior}}">
            <div class="building-entry__scene">
            <img src="{{image}}" alt="{{name}}" loading="lazy" onerror="window.App.onImageError(this)">
            {{#owner_stamp}}<span class="owner-stamp" role="img" aria-label="{{owner_label}}" title="{{owner_label}}">{{owner_stamp}}</span>{{/owner_stamp}}
            {{#building_entry}}
            <button class="building-entry__enter" type="button" data-building-room="{{target}}" aria-label="{{label}}">
              <span class="building-entry__enter-label" aria-hidden="true">{{label}} →</span>
              <span class="building-entry__enter-hint" aria-hidden="true">点击{{label}} <span>→</span></span>
            </button>
            {{/building_entry}}
            {{#scene_hotspots}}<button class="scene-hotspot" type="button" style="{{position}}" data-building-room="{{target}}" data-hint-align="{{hint_align}}" aria-label="{{label}}：{{hint}}"><span class="scene-hotspot__hint">{{label}} · {{hint}} →</span></button>{{/scene_hotspots}}
            </div>
          </div>
          <p class="building-entry__caption"><span>{{number}}</span> {{#preview_caption}}{{preview_caption}}{{/preview_caption}}{{^preview_caption}}屋外入口{{/preview_caption}}</p>
          <nav class="building-route" aria-label="入阁路线">
            <ol>
              {{#building_route}}
              <li>{{^first}}<span class="building-route__arrow" aria-hidden="true">›</span>{{/first}}{{#current}}<span aria-current="step">{{name}}</span>{{/current}}{{^current}}<button type="button" data-building-room="{{id}}">{{name}}</button>{{/current}}</li>
              {{/building_route}}
            </ol>
          </nav>
          <div class="building-entry__exits" role="group" aria-label="从{{name}}出发">
            {{#building_exits}}<button type="button" data-building-room="{{target}}">{{label}} <span aria-hidden="true">→</span></button>{{/building_exits}}
          </div>
        </div>
        <div class="building-entry__body">
          <p class="building-entry__eyebrow">{{category_label}}{{#owner_label}} · {{owner_label}}{{/owner_label}}</p>
          <h3 class="building-entry__title" tabindex="-1">{{name}}</h3>
          <p class="building-entry__summary">{{summary}}</p>
          {{#has_building_highlights}}
          <section class="building-overview" aria-label="室内功能概览">
            <h4>室内有什么用 <span>进入任一房间后生效</span></h4>
            <div class="building-overview__grid">
              {{#building_highlights}}<div class="building-overview__feature"><h5>{{title}}</h5><p>{{{html}}}</p></div>{{/building_highlights}}
            </div>
          </section>
          <details class="building-entry__rules">
            <summary>效果限制与往返路线 <span class="building-entry__expand">展开查看</span></summary>
          {{/has_building_highlights}}
          <div class="building-entry__sections">
            {{#building_sections}}
            <section class="building-detail{{#is_note}} building-detail--note{{/is_note}}">
              <h4>{{title}}</h4>
              {{#paragraphs}}<p>{{{html}}}</p>{{/paragraphs}}
              {{#has_list}}<ul>{{#list_items}}<li>{{{html}}}</li>{{/list_items}}</ul>{{/has_list}}
              {{#has_table}}<div class="building-detail__table"><table>
                <thead><tr>{{#headers}}<th scope="col">{{text}}</th>{{/headers}}</tr></thead>
                <tbody>{{#rows}}<tr><th scope="row">{{{label}}}</th>{{#cells}}<td>{{{html}}}</td>{{/cells}}</tr>{{/rows}}</tbody>
              </table></div>{{/has_table}}
            </section>
            {{/building_sections}}
          </div>
          <button class="building-entry__more" type="button" data-open-entry="{{id}}">完整规则与路线 <span aria-hidden="true">↗</span></button>
          {{#has_building_highlights}}</details>{{/has_building_highlights}}
        </div>
      </article>
      {{/entries}}
    </div>
  </script>

  <script id="tpl-search-results" type="x-tmpl-mustache">
    <div class="search-results">
      <p class="filters-summary">{{summary}}</p>
      {{#results_present}}
      <div class="stack">
        {{#results}}
        <article class="search-result card">
          <button class="search-result__button" type="button" data-open-entry="{{id}}">
            <span class="search-result__type">{{type_label}}</span>
            <strong>{{{title_html}}}</strong>
            <span>{{{excerpt_html}}}</span>
          </button>
        </article>
        {{/results}}
      </div>
      {{/results_present}}
      {{^results_present}}
      <div class="empty-state card">
        <p>空处尚多，暂未找到相符条目。</p>
      </div>
      {{/results_present}}
    </div>
  </script>

  <script id="tpl-mechanics" type="x-tmpl-mustache">
    <div class="items-grid">
      {{#mechanics}}
      <article class="item-card card" data-entry-target="{{id}}">
        <button class="card-link" type="button" data-open-entry="{{id}}">
          <span class="item-card__image">
            <img src="{{illustration}}" alt="{{title}}" loading="lazy" onerror="window.App.onImageError(this)">
          </span>
          <span class="item-card__meta">
            <span class="item-card__topline">机制</span>
            <strong>{{title}}</strong>
            <span>{{subtitle}}</span>
          </span>
          <span class="item-card__owner">机制</span>
        </button>
      </article>
      {{/mechanics}}
    </div>
  </script>

  <script id="tpl-terrains" type="x-tmpl-mustache">
    <div class="items-grid">
      {{#terrains}}
      <article class="item-card card" data-entry-target="{{id}}">
        <button class="card-link" type="button" data-open-entry="{{id}}">
          <span class="item-card__image">
            <img src="{{image}}" alt="{{title}}" loading="lazy" onerror="window.App.onImageError(this)">
          </span>
          <span class="item-card__meta">
            <span class="item-card__topline">建筑</span>
            <strong>{{title}}</strong>
            <span>{{summary}}</span>
          </span>
          <span class="item-card__owner">建筑</span>
        </button>
      </article>
      {{/terrains}}
    </div>
  </script>

  <script id="tpl-changelog" type="x-tmpl-mustache">
    <div class="timeline reveal">
      {{#entries}}
      <article class="timeline-entry card" data-entry-target="{{id}}">
        <div class="timeline-entry__version">
          <span>{{version}}</span>
          {{#is_latest}}<span class="seal-mark seal-mark--new">新</span>{{/is_latest}}
        </div>
        <div class="timeline-entry__body">
          <button class="timeline-entry__header" type="button" data-open-entry="{{id}}">
            <h3>{{title}}</h3>
            {{#date}}<p>{{date}}</p>{{/date}}
          </button>
          <ul class="dash-list">
            {{#changes}}
            <li>{{{text}}}</li>
            {{/changes}}
          </ul>
        </div>
      </article>
      {{/entries}}
    </div>
  </script>

  <script id="tpl-footer" type="x-tmpl-mustache">
    <div class="footer-grid">
      <div>
        <div class="site-mark site-mark--footer" aria-hidden="true">
          <span class="site-mark__line"></span>
          <span class="site-mark__label">序</span>
        </div>
        <p>{{manifesto}}</p>
      </div>
      <div>
        <h2>外链</h2>
        <ul class="plain-list">
          {{#links}}
          <li><a href="{{url}}" target="_blank" rel="noreferrer">{{label}}</a></li>
          {{/links}}
        </ul>
      </div>
      <div>
        <h2>落款</h2>
        <p>{{author}}</p>
        <p>{{year}}</p>
      </div>
    </div>
    <p class="site-footer__note">{{copyright}}</p>
  </script>

  <script id="tpl-modal-generic" type="x-tmpl-mustache">
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-shell" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <div class="modal-card__tools">
          <button class="icon-button modal-close" type="button" data-modal-close aria-label="关闭详情">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18"></path>
            </svg>
          </button>
          <button class="icon-button modal-share" type="button" data-copy-link="{{id}}" aria-label="分享链接（复制）" title="复制链接以分享">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"></path>
            </svg>
          </button>
        </div>
        <div class="modal-card__overview{{#image}} modal-card__overview--illustrated{{/image}}{{#preview_caption}} modal-card__overview--scene{{/preview_caption}}">
        <div class="modal-card__head">
          {{#parent_item}}<button class="button button--ghost" type="button" data-open-entry="{{id}}">← 返回{{name}}</button>{{/parent_item}}
          <div>
            <p class="modal-card__eyebrow">{{eyebrow}}</p>
            {{#availability}}<p class="availability-badge">{{availability}}</p>{{/availability}}
            <h2 id="modal-title" class="entry-title">{{#icon}}<img class="entry-icon" src="{{icon}}" alt="" onerror="window.App.onImageError(this)">{{/icon}}<span>{{title}}{{#title_note}}<small class="entry-title__note">{{title_note}}</small>{{/title_note}}</span></h2>
            <p>{{subtitle}}</p>
          </div>
        </div>
        {{#image}}
        <div class="modal-card__visual{{#owner_stamp}} modal-card__visual--owned{{/owner_stamp}}{{#has_scene_hotspots}} scene-preview{{/has_scene_hotspots}}">
        <picture class="display-picture">
        {{#display_poster}}<source media="(prefers-reduced-motion: reduce)" srcset="{{display_poster}}">{{/display_poster}}
        <img class="modal-card__hero" src="{{image}}" alt="{{title}}" loading="lazy" onerror="window.App.onImageError(this)">
        </picture>
        {{#owner_stamp}}<span class="owner-stamp" role="img" aria-label="{{owner_label}}" title="{{owner_label}}">{{owner_stamp}}</span>{{/owner_stamp}}
        {{#scene_hotspots}}
        <button class="scene-hotspot" type="button" style="{{position}}" data-open-entry="{{target}}" data-hint-align="{{hint_align}}" aria-label="{{label}}：{{hint}}">
          <span class="scene-hotspot__hint">{{label}} · {{hint}} →</span>
        </button>
        {{/scene_hotspots}}
        </div>
        {{/image}}
        {{#preview_caption}}<p class="scene-preview-caption">{{preview_caption}}</p>{{/preview_caption}}
        {{#scene_hint}}<p class="scene-preview-hint">{{scene_hint}}</p>{{/scene_hint}}
        </div>
        <div class="modal-card__content prose">
          {{#paragraphs}}
          <p>{{{html}}}</p>
          {{/paragraphs}}
        </div>
        {{#has_detail_blocks}}
        <div class="detail-blocks">
          {{#detail_blocks}}
          <section class="detail-block{{#is_image}} detail-block--image{{/is_image}}{{#is_note}} detail-block--note{{/is_note}}">
            {{#title}}<h3>{{title}}</h3>{{/title}}
            {{#is_text}}{{#text_paragraphs}}<p>{{{html}}}</p>{{/text_paragraphs}}{{/is_text}}
            {{#is_list}}
            <ul class="detail-list{{#list_is_grid}} detail-list--grid{{/list_is_grid}}">
              {{#list_items}}<li>{{{html}}}</li>{{/list_items}}
            </ul>
            {{/is_list}}
            {{#is_stats}}
            <dl class="detail-stats">
              {{#stats}}<div><dt>{{label}}</dt><dd>{{value}}{{#unit}}<span>{{unit}}</span>{{/unit}}</dd></div>{{/stats}}
            </dl>
            {{/is_stats}}
            {{#is_table}}
            <div class="detail-table-wrap" role="region" aria-label="{{table_label}}" tabindex="0">
              <table class="detail-table">
                <thead><tr>{{#table_headers}}<th scope="col">{{label}}</th>{{/table_headers}}</tr></thead>
                <tbody>{{#table_rows}}<tr><th scope="row">{{{label_html}}}</th>{{#cells}}<td>{{{html}}}</td>{{/cells}}</tr>{{/table_rows}}</tbody>
              </table>
            </div>
            {{/is_table}}
            {{#is_image}}
            <figure>
              <span class="detail-image">
              <img src="{{src}}" alt="{{caption}}" loading="lazy" onerror="window.App.onImageError(this)">
              {{#owner_stamp}}<span class="owner-stamp" role="img" aria-label="{{owner_label}}" title="{{owner_label}}">{{owner_stamp}}</span>{{/owner_stamp}}
              </span>
              <figcaption>{{caption}}</figcaption>
            </figure>
            {{/is_image}}
          </section>
          {{/detail_blocks}}
        </div>
        {{/has_detail_blocks}}
        {{#recipe_html}}
        <section class="recipe-row detail-block">
          <h3>制作与获取</h3>
          {{#tech_html}}<p class="recipe-tech">{{{tech_html}}}</p>{{/tech_html}}
          <div>{{{recipe_html}}}</div>
        </section>
        {{/recipe_html}}
        {{#has_skins}}
        <section class="item-appearances detail-block" aria-labelledby="item-appearances-title">
          <h3 id="item-appearances-title">物品外观 <span class="item-appearances__count">{{skin_count}} 款</span></h3>
          <div class="item-appearances__grid">
            {{#skins}}
            <button class="item-appearance" type="button" data-open-entry="{{id}}" aria-label="查看{{name}}外观">
              <span class="item-appearance__image"><img src="{{image}}" alt="{{name}}" loading="lazy" onerror="window.App.onImageError(this)">{{#owner_stamp}}<span class="owner-stamp" role="img" aria-label="{{owner_label}}" title="{{owner_label}}">{{owner_stamp}}</span>{{/owner_stamp}}</span>
              <span>{{name}}</span>
            </button>
            {{/skins}}
          </div>
        </section>
        {{/has_skins}}
        {{#has_related}}
        <div class="related-row">
          <h3>关联</h3>
          <div class="chip-row">
            {{#related}}
            <button class="chip" type="button" data-open-entry="{{id}}">{{name}}</button>
            {{/related}}
          </div>
        </div>
        {{/has_related}}
      </div>
    </div>
  </script>

  <script id="tpl-editor-panel" type="x-tmpl-mustache">
    <div class="editor-panel__head">
      <h2>校阅</h2>
      <span>{{count}}</span>
    </div>
    <div class="stack">
      {{#issues}}
      <button class="editor-issue" type="button" data-editor-target="{{target}}">
        <strong>[{{type}}]</strong>
        <span>{{location}} — {{summary}}</span>
      </button>
      {{/issues}}
    </div>
  </script>

  <script src="assets/js/vendor/mustache.min.js" defer></script>
  <script src="data/site-data.js" defer></script>
  <script src="data/vanilla-icons.js" defer></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/render.js" defer></script>
  <script src="assets/js/recipe.js" defer></script>
  <script src="assets/js/linkify.js" defer></script>
  <script src="assets/js/filter.js" defer></script>
  <script src="assets/js/carousel.js" defer></script>
  <script src="assets/js/modal.js" defer></script>
  <script src="assets/js/char-popup.js" defer></script>
  <script src="assets/js/editor.js" defer></script>
  <script src="assets/js/motion.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
